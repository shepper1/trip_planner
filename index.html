<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trip Planner - Votre Itinéraire IA</title>
    <link href="./src/output.css" rel="stylesheet">
    <style>
        /* Style pour masquer les éléments tout en les gardant dans le DOM */
        .hidden { display: none; }
        /* Style pour les fichiers masqués, imitant l'apparence sur macOS */
        .hidden-file { opacity: 0.5; }
    </style>
</head>
<body class="bg-gray-50 flex items-center justify-center min-h-screen">

    <div class="w-full max-w-lg p-8 bg-white shadow-xl rounded-lg">
        <h1 class="text-3xl font-bold text-gray-800 mb-4 text-center">Planifiez votre voyage ✈️</h1>
        <p class="text-gray-600 mb-8 text-center">Laissez notre IA experte créer votre itinéraire personnalisé en 15 minutes.</p>

        <form id="tripForm" class="space-y-6">
            
            <div id="destination-group">
                <label for="destination" class="block text-sm font-medium text-gray-700">Destination (Ville ou Pays)</label>
                <input type="text" id="destination" name="destination" required class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-3 focus:ring-blue-500 focus:border-blue-500">
            </div>

            <div class="flex space-x-4">
                <div class="w-1/2">
                    <label for="date_debut" class="block text-sm font-medium text-gray-700">Date de début</label>
                    <input type="date" id="date_debut" name="date_debut" required class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-3 focus:ring-blue-500 focus:border-blue-500">
                </div>
                <div class="w-1/2">
                    <label for="date_fin" class="block text-sm font-medium text-gray-700">Date de fin</label>
                    <input type="date" id="date_fin" name="date_fin" required class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-3 focus:ring-blue-500 focus:border-blue-500">
                </div>
            </div>

            <div>
                <label for="interests" class="block text-sm font-medium text-gray-700">Intérêts (ex: Musées, Nature, Gastronomie)</label>
                <textarea id="interests" name="interests" rows="3" class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-3 focus:ring-blue-500 focus:border-blue-500"></textarea>
            </div>
            
            <div>
                <label for="email" class="block text-sm font-medium text-gray-700">Votre Email (pour recevoir l'itinéraire)</label>
                <input type="email" id="email" name="email" required class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-3 focus:ring-blue-500 focus:border-blue-500">
            </div>

            <div class="flex items-start">
                <div class="flex items-center h-5">
                    <input id="surprise_me" name="surprise_me" type="checkbox" class="focus:ring-blue-500 h-4 w-4 text-blue-600 border-gray-300 rounded">
                </div>
                <div class="ml-3 text-sm">
                    <label for="surprise_me" class="font-medium text-gray-700">Surprenez-moi !</label>
                    <p class="text-gray-500">L'IA choisit la destination et/ou les dates pour une aventure inattendue.</p>
                </div>
            </div>

            <button type="submit" id="submitButton" class="w-full flex justify-center py-3 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500">
                Générer mon voyage (Gratuit)
            </button>
            
            <div id="message" class="mt-4 p-3 rounded-md text-sm text-center hidden"></div>
        </form>
    </div>

    <script>
        // --- CONFIGURATION API SELF-HOSTED ---
        // !!! Mettez à jour ces URLs avec votre domaine !!!
        
        // URL de base pour PocketBase (pour l'authentification future et la BDD)
        const PB_URL = "https://api.votre-domaine.com"; 

        // Webhook pour l'itinéraire gratuit (Lead Magnet, géré par n8n)
        const WEBHOOK_FREE = 'http://192.168.0.20:5678/webhook/695e2724-613b-4430-bdc5-9b07dbe38fca'; 

        // Webhook pour l'itinéraire PRO (Payant, géré par n8n)
        // Note: Non utilisé ici, mais maintenu pour la documentation
        const WEBHOOK_PRO = 'http://192.168.0.20:5678/webhook/695e2724-613b-4430-bdc5-9b07dbe38fca'; 

        // --- ELEMENTS DU DOM ---
        const form = document.getElementById('tripForm');
        const messageDiv = document.getElementById('message');
        const surpriseCheckbox = document.getElementById('surprise_me');
        const destinationGroup = document.getElementById('destination-group');
        const destinationInput = document.getElementById('destination');
        const submitButton = document.getElementById('submitButton');

        // --- FONCTIONNALITÉ SURPRISE-MOI ---
        surpriseCheckbox.addEventListener('change', function() {
            if (this.checked) {
                // Masquer le champ Destination
                destinationGroup.classList.add('hidden');
                destinationInput.removeAttribute('required');
                destinationInput.value = 'AI_CHOICE'; // Marqueur pour le backend
            } else {
                // Rétablir le champ Destination
                destinationGroup.classList.remove('hidden');
                destinationInput.setAttribute('required', 'required');
                destinationInput.value = '';
            }
        });

        // --- GESTION DU FORMULAIRE ---
        form.addEventListener('submit', async function(e) {
            e.preventDefault();
            
            // Collecte des données du formulaire
            const formData = new FormData(form);
            const data = Object.fromEntries(formData.entries());

            // Afficher le message de traitement
            messageDiv.classList.remove('hidden', 'bg-green-100', 'text-green-700');
            messageDiv.classList.add('bg-blue-100', 'text-blue-700');
            messageDiv.textContent = '🧠 Votre demande est en cours de traitement par l\'IA... (Max 15 minutes)';
            submitButton.disabled = true;
            submitButton.textContent = 'Envoi...';

            // --- APPEL AU WEBHOOK N8N ---
            try {
                const response = await fetch(WEBHOOK_FREE, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(data)
                });

                if (response.ok) {
                    messageDiv.classList.remove('bg-blue-100', 'text-blue-700');
                    messageDiv.classList.add('bg-green-100', 'text-green-700');
                    messageDiv.textContent = '✅ Succès ! Votre itinéraire sera envoyé à ' + data.email + ' sous peu.';
                    form.reset();
                    // Réactiver le bouton après un petit délai visuel
                    setTimeout(() => {
                        submitButton.disabled = false;
                        submitButton.textContent = 'Générer mon voyage (Gratuit)';
                    }, 3000);
                    
                } else {
                    const errorData = await response.json();
                    throw new Error(errorData.message || 'Erreur lors de l\'appel au Webhook.');
                }
            } catch (error) {
                console.error('Erreur:', error);
                messageDiv.classList.remove('bg-blue-100', 'text-blue-700');
                messageDiv.classList.add('bg-red-100', 'text-red-700');
                messageDiv.textContent = '❌ Une erreur est survenue : ' + error.message;
                
                // Réactiver le bouton
                submitButton.disabled = false;
                submitButton.textContent = 'Réessayer';
            }
        });

    </script>
</body>
</html>
